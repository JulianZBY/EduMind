[tools]
python = "3.14"
node = "26"
"npm:pyright" = "1.1.414"

[env]
_.python.venv = { path = "backend/.venv", create = true }

[tasks.setup]
description = "安装前后端依赖（pip install -r requirements.txt + npm ci）"
depends = ["setup:backend", "setup:frontend"]

[tasks."setup:backend"]
dir = "backend"
run = '.venv\Scripts\pip.exe install -r requirements.txt'

[tasks."setup:frontend"]
dir = "frontend"
run = "npm ci"

[tasks."dev:backend"]
dir = "backend"
description = "后端 uvicorn @ 127.0.0.1:8000"
run = '.venv\Scripts\uvicorn.exe app.main:app --host 127.0.0.1 --port 8000'

[tasks."dev:frontend"]
dir = "frontend"
description = "前端 vite dev @ 5173"
run = "npm run dev"

[tasks.dev]
description = "一键启动前后端开发服务（并行，Ctrl+C 停止）"
depends = ["dev:backend", "dev:frontend"]

[tasks."lint:backend"]
dir = "backend"
run = '.venv\Scripts\ruff.exe check .'

[tasks."lint:types"]
dir = "backend"
run = "pyright app"

[tasks."lint:frontend"]
dir = "frontend"
run = "npm run lint"

[tasks.lint]
description = "后端 ruff + 类型检查 + 前端 lint/风格扫描"
depends = ["lint:backend", "lint:types", "lint:frontend"]

[tasks."test:backend"]
dir = "backend"
run = '.venv\Scripts\pytest.exe -q'

[tasks."test:frontend"]
dir = "frontend"
run = "npm test"

[tasks.test]
description = "后端 pytest + 前端 node --test"
depends = ["test:backend", "test:frontend"]

[tasks.build]
dir = "frontend"
description = "前端类型检查 + 构建"
run = "npm run build"

[tasks."check:routes"]
dir = "frontend"
run = "node scripts/check-routes.mjs"

[tasks.check]
description = "全部门禁：lint + test + build + routes"
depends = ["lint", "test", "build", "check:routes"]
