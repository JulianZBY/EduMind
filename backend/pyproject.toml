[project]
name = "edumind-backend"
version = "0.1.0"
description = "EduMind 多模态 AI 互动式教学智能体 - 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "opencv-python-headless>=5.0.0.93",
    "sqlite-vec>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ASYNC230: 本地文件读取（PDF/图片，规模可控）在 async 中直接 open 可接受
ignore = ["ASYNC230"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
