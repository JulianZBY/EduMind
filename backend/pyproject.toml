[project]
name = "edumind-backend"
version = "0.1.0"
description = "EduMind 多模态 AI 互动式教学智能体 - 后端"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["ASYNC230", "EXE002"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
