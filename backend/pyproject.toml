# 依赖不在此声明：后端依赖统一在 requirements.txt（全钉版本），
# 用 `pip install -r requirements.txt` 安装（见 mise.toml 的 setup 任务）。

[project]
name = "edumind-backend"
version = "0.1.0"
description = "EduMind 多模态 AI 互动式教学智能体 - 后端"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ASYNC230: 本地文件读取（PDF/图片，规模可控）在 async 中直接 open 可接受
# EXE002: /mnt/Data 为 fuse 挂载，强制全部文件 777，ruff 误报 ~146 个「可执行但无 shebang」；
#   git 实录 mode 均为 100644，chmod 不贴，未触碰的基线文件同样中招（2026-10-08 维护者拍板全局忽略）
ignore = ["ASYNC230", "EXE002"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
# LSP/类型检查环境:钉住项目 venv,避免依赖解析失败产生级联假报
venvPath = "."
venv = ".venv"
